name: avero-local

x-backend-environment: &backend-environment
  # Deliberately independent of backend/.env and the finance_dashboard database.
  DATABASE_URL: postgresql+psycopg://avero:${AVERO_DB_PASSWORD:?Generate .env.compose.local first}@postgres:5432/avero_compose
  AUTH_JWT_SECRET: ${AVERO_AUTH_JWT_SECRET:?Generate .env.compose.local first}
  APP_ENV: development
  CORS_ALLOWED_ORIGINS: '["http://127.0.0.1:${AVERO_HTTP_PORT:-8080}"]'

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: avero
      POSTGRES_PASSWORD: ${AVERO_DB_PASSWORD:?Generate .env.compose.local first}
      POSTGRES_DB: avero_compose
    volumes:
      - postgres_phase8_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    build: ./backend
    environment: *backend-environment
    command: [python, docker/migrate.py]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment: *backend-environment
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://127.0.0.1:${AVERO_HTTP_PORT:-8080}/api/v1
    ports:
      - "127.0.0.1:${AVERO_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_phase8_data:
