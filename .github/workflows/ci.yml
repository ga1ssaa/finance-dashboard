name: CI

on:
  push:
    branches: [feat/fullstack]
  pull_request:
    branches: [feat/fullstack, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUN_PHASE4_E2E: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Frontend tests (live database fixture disabled)
        run: node --test tests/*.test.mjs
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npx --no-install tsc -b --pretty false
      - name: Production build
        run: npm run build

  backend:
    name: Backend (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUN_DATABASE_TESTS: "0"
      # Invalid reserved hostname; never a development or production target.
      DATABASE_URL: postgresql+psycopg://ci:unused@invalid.invalid:1/avero_ci_disabled
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install --disable-pip-version-check -e './backend[dev]'
      - name: Offline pytest (existing database guards retained)
        run: python -m pytest -q backend/tests

  docker:
    name: Docker configuration and images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Synthetic interpolation values only. No services or database are started.
      AVERO_DB_PASSWORD: ci-only-unused-database-password
      AVERO_AUTH_JWT_SECRET: ci-only-unused-signing-key-at-least-32-bytes
      AVERO_HTTP_PORT: "8080"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Validate Compose without logging resolved environment
        run: docker compose --env-file .env.compose.example config --quiet
      - name: Compose isolation and configuration tests
        run: python docker/test_config.py
      - name: Build frontend and API images
        # migrate uses exactly the backend Dockerfile; avoid building it twice.
        run: docker compose --env-file .env.compose.example build frontend backend

  security:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Audit locked npm dependencies (no install or upgrades)
        run: |
          status=0
          npm audit --package-lock-only --json > "$RUNNER_TEMP/npm-audit.json" || status=$?
          if (( status > 1 )); then
            echo '::error::npm audit could not complete. Check registry connectivity and rerun.'
            exit "$status"
          fi
      - name: Resolve backend dependencies and capture exact audit input
        run: |
          python -m pip install --disable-pip-version-check -e './backend[dev]'
          python -m pip freeze --exclude-editable > "$RUNNER_TEMP/backend-audit-requirements.txt"
          # Capture application/test dependencies before installing the audit tool.
          python -m pip install --disable-pip-version-check 'pip-audit==2.10.1'
      - name: Audit resolved Python dependencies
        run: |
          status=0
          pip-audit --requirement "$RUNNER_TEMP/backend-audit-requirements.txt" \
            --no-deps --disable-pip --progress-spinner off --format json \
            --output "$RUNNER_TEMP/python-audit.json" || status=$?
          if (( status > 1 )); then
            echo '::error::Python audit could not complete. Check advisory service connectivity and rerun.'
            exit "$status"
          fi
      - name: Test dependency report and failure policy
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -q
      - name: Summarize findings and enforce security gate
        run: |
          python .github/scripts/report_audits.py \
            --npm "$RUNNER_TEMP/npm-audit.json" \
            --python "$RUNNER_TEMP/python-audit.json"
